site_name: Data & AI for Designers and Journalists
site_description: >-
  A hands-on book for designers and journalists — reading and building with
  data, machine learning and AI, as a material and as evidence. Companion to
  the HU Master Data-driven Design and the Big Data and Design minor.
site_author: Erik Hekman
site_url: https://hekman.github.io/data-ai-book/

repo_url: https://github.com/Hekman/data-ai-book
repo_name: Hekman/data-ai-book
edit_uri: edit/main/docs/

copyright: >-
  © Erik Hekman · HU University of Applied Sciences Utrecht ·
  Text & code CC BY-NC-SA 4.0

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Newsreader
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    logo: material/table-large
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Hekman
    - icon: fontawesome/solid/graduation-cap
      link: https://www.hu.nl/voltijd-opleidingen/master-data-driven-design
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/erikhekman/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - redirects:
      redirect_maps:
        part-i/chapter-1.md: part-i/data-variables-structures.md
        part-i/chapter-2.md: part-i/where-data-comes-from.md
        part-i/chapter-3.md: part-i/the-dataframe.md
        part-i/chapter-4.md: part-i/cleaning-messy-data.md
        part-i/chapter-5.md: part-i/combining-datasets.md
        part-i/chapter-6.md: part-i/descriptive-statistics.md
        part-i/chapter-7.md: part-i/visualisation.md
        part-i/chapter-8.md: part-i/dashboards.md
        part-i/chapter-9.md: part-i/apis.md

nav:
  - Home: index.md
  - "Introduction · The practitioner's stance": introduction.md
  - "Part I · Data as Material":
      - part-i/index.md
      - "1 · Data, variables & structures": part-i/data-variables-structures.md
      - "2 · The dataframe": part-i/the-dataframe.md
      - "3 · Cleaning & messy data": part-i/cleaning-messy-data.md
      - "4 · Combining datasets": part-i/combining-datasets.md
      - "5 · Where data comes from": part-i/where-data-comes-from.md
      - "6 · Collecting data: APIs": part-i/apis.md
      - "7 · Descriptive statistics": part-i/descriptive-statistics.md
      - "8 · Visualisation as argument": part-i/visualisation.md
      - "9 · Dashboards": part-i/dashboards.md
      - "10 · Collecting data: Scraping the web": part-i/scraping.md
  - "Part II · Reading the Systems That Learn":
      - part-ii/index.md
      - "11 · The loop: interfaces that teach models": part-ii/the-loop.md
      - "12 · Correlation & regression": part-ii/regression.md
      - "13 · Decision trees": part-ii/decision-trees.md
      - "14 · k-nearest neighbours": part-ii/k-nearest-neighbours.md
      - "15 · k-means clustering": part-ii/clustering.md
      - "16 · Cosine similarity & recommenders": part-ii/similarity-and-recommenders.md
      - "17 · Text as data": part-ii/text-as-data.md
      - "18 · The interface around the model": part-ii/the-interface-around-the-model.md
  - "Colophon": colophon.md
